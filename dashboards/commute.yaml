          ha-markdown-element > div > div > div {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 6px;
            margin-bottom: 8px;
            font-size: 16px;
            line-height: 24px;
          }

          td[colspan] { font-size: 12px; color: var(--secondary-text-color); }

          table {
            display: table;
            width: 100%;
            table-layout: auto;
            border-collapse: collapse;
            font-size: 16px;
            line-height: 22px;
            font-variant-numeric: tabular-nums;
          }

          table, tr, td, th { border: 0 !important; }

          td {
            padding: 8px 6px;
            border: 0;
            text-align: left;
            vertical-align: middle;
            white-space: nowrap;
          }

          td:first-child > span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
          }

          td:last-child { font-size: 13px; color: var(--secondary-text-color); }

          td:nth-child(4) { font-size: 13px; color: #db4437; }

          ha-icon { --mdc-icon-size: 18px; flex: 0 0 18px; }

          td:nth-child(2) { font-size: 13px; text-align: center; }
    grid_options:
      rows: 3
      columns: 12
    visibility:
      - condition: state
        entity: binary_sensor.jacob_work_commute
        state: 'on'
