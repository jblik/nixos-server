  - type: custom:button-card
    section_mode: true
    show_name: false
    show_icon: false
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Calendar
          initial_style: wide
          style_sequence:
          - wide
          - fullscreen
          content:
            type: calendar
            initial_view: dayGridMonth
            entities: |
              [[[
                return Object.keys(states).filter(entity => entity.startsWith("calendar.")).sort();
              ]]]
            card_mod:
              style: |
                ha-card {
                  border: none;
                  box-shadow: none;
                }
                ha-full-calendar {
                  --calendar-height: min(72vh, 800px);
                }
            show_add_event: true
            add_event_style: header
          popup_styles:
          - style: all
            styles: |
              ha-dialog {
                --popup-width: 1200px;
                --popup-max-width: calc(100vw - 24px);
              }
    styles:
      card:
      - padding: '0'
      - height: 100%
      - overflow-y: auto
      grid:
      - grid-template-areas: '"calendar"'
      - grid-template-columns: minmax(0, 1fr)
      - grid-template-rows: min-content
      - align-content: start
      custom_fields:
        calendar:
        - pointer-events: none
        - width: 100%
        - min-width: '0'
    custom_fields:
      calendar:
        card:
          showLoader: false
          type: custom:atomic-calendar-revive
          entities:
          - entity: calendar.jacob
            color: "#4CAF50"
          - entity: calendar.sophie
            color: "#E91E63"
          - entity: calendar.bears
            color: "#2196F3"
          - entity: calendar.sophie_uni
            color: "#E91E63"
          calShowDescription: false
          showTimeRemaining: false
          hoursOnSameLine: false
          compactMode: false
          card_mod:
            style: |
              ha-card {
                border: none;
                box-shadow: none;
                text-align: left;
              }
    grid_options:
      rows: 7
      columns: 12
    visibility:
    - condition: state
      entity: binary_sensor.sophie_work_commute
      state_not: 'on'
    - condition: state
      entity: binary_sensor.jacob_work_commute
      state_not: 'on'
    - condition: state
      entity: binary_sensor.jacob_uni_commute
      state_not: 'on'
