        {% elif has_value(entity) %}
          {{ value }} {{ unit or '' }}
        {% else %}
          Unavailable
        {% endif %}
      secondary: Sent · counter total
      icon: mdi:upload-network
      color: teal
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: statistics-graph
      title: Transferred per hour
      chart_type: bar
      period: hour
      days_to_show: 1
      stat_types:
      - change
      entities:
      - entity: sensor.devices_router_zyxel_bytes_received
        name: Received
        color: '#00bcd4'
      - entity: sensor.devices_router_zyxel_bytes_sent
        name: Sent
        color: '#009688'
