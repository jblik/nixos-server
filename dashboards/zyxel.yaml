title: Zyxel Network
views:
- title: Overview
  path: overview
  icon: mdi:router-network
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Router
      heading_style: title
      icon: mdi:router-wireless
    - type: custom:mushroom-template-card
      entity: sensor.devices_router_zyxel_lanhosts_waninfo_wanstatus
      primary: '{{ states(entity) if has_value(entity) else ''Unavailable'' }}'
      secondary: WAN status · router reported
      icon: mdi:web
      color: cyan
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: sensor.devices_router_zyxel_device_deviceinfo_uptime
      primary: |-
        {% set value = states(entity) %}
        {% if is_number(value) %}
          {% set s = value | int %}
          {{ s // 86400 }}d {{ (s % 86400) // 3600 }}h {{ (s % 3600) // 60 }}m
        {% else %}
          Unavailable
        {% endif %}
      secondary: Router uptime
      icon: mdi:clock-outline
      color: teal
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: sensor.devices_router_zyxel_device_systeminfo_cpuusage
      primary: |-
        {% if has_value(entity) %}
          {{ states(entity) }} {{ state_attr(entity, 'unit_of_measurement') or '' }}
        {% else %}
          Unavailable
        {% endif %}
      secondary: CPU load · reported value
      icon: mdi:chip
      color: purple
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: sensor.devices_router_zyxel_device_systeminfo_free
      primary: |-
        {% set total = states('sensor.devices_router_zyxel_device_systeminfo_total') %}
        {% set free = states('sensor.devices_router_zyxel_device_systeminfo_free') %}
        {% if is_number(total) and is_number(free) and total | float > 0
            and 0 <= free | float <= total | float %}
          {{ (100 * (1 - free | float / total | float)) | round(1) }} %
        {% else %}
          Unavailable
        {% endif %}
      secondary: Memory used
      icon: mdi:memory
      color: purple
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: entities
      title: Device
      show_header_toggle: false
      entities:
      - entity: sensor.devices_router_zyxel_device_systeminfo_hostname
        name: Hostname
      - entity: sensor.devices_router_zyxel_device_deviceinfo_modelname
        name: Model
      - entity: sensor.devices_router_zyxel_device_deviceinfo_softwareversion
        name: Firmware
      - entity: sensor.devices_router_zyxel_device_deviceinfo_hardwareversion
        name: Hardware
      - entity: sensor.devices_router_zyxel_device_x_zyxel_interfaceuptime
        name: Interface uptime · raw
  - type: grid
    cards:
    - type: heading
      heading: Fiber connection
      heading_style: title
      icon: mdi:fiber-optic
    - type: custom:mushroom-template-card
      entity: sensor.devices_router_zyxel_cardpage_gponstatsinfo_status
      primary: '{{ states(entity) if has_value(entity) else ''Unavailable'' }}'
      secondary: GPON status
      icon: mdi:fiber-optic
      color: cyan
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: sensor.devices_router_zyxel_cardpage_gponstatsinfo_temperature
      primary: |-
        {% if has_value(entity) %}
          {{ states(entity) }} {{ state_attr(entity, 'unit_of_measurement') or '' }}
        {% else %}
          Unavailable
        {% endif %}
      secondary: Optical module temperature
      icon: mdi:thermometer
      color: orange
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: sensor.devices_router_zyxel_cardpage_gponstatsinfo_rxpowersignal
      primary: |-
        {% if has_value(entity) %}
          {{ states(entity) }} {{ state_attr(entity, 'unit_of_measurement') or '' }}
        {% else %}
          Unavailable
        {% endif %}
      secondary: Optical receive power
      icon: mdi:arrow-down-bold
      color: cyan
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: sensor.devices_router_zyxel_cardpage_gponstatsinfo_txpowersignal
      primary: |-
        {% if has_value(entity) %}
          {{ states(entity) }} {{ state_attr(entity, 'unit_of_measurement') or '' }}
        {% else %}
          Unavailable
        {% endif %}
      secondary: Optical transmit power
      icon: mdi:arrow-up-bold
      color: teal
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: entities
      title: Link details
      show_header_toggle: false
      entities:
      - entity: sensor.devices_router_zyxel_cardpage_wantype
        name: WAN type
      - entity: sensor.devices_router_zyxel_cardpage_gponstatsinfo_currentspeed
        name: Current link speed · raw
      - entity: sensor.devices_router_zyxel_cardpage_gponstatsinfo_bitrate
        name: Bitrate · raw
      - entity: sensor.devices_router_zyxel_cardpage_gponstatsinfo_sfp_vendor
        name: Optical module vendor
      - entity: sensor.devices_router_zyxel_cardpage_gponstatsinfo_sfp_model
        name: Optical module model
      - entity: sensor.devices_router_zyxel_cardpage_gponstatsinfo_lastchange
        name: Last change · raw
  - type: grid
    cards:
    - type: heading
      heading: Local network
      heading_style: title
      icon: mdi:lan
    - type: custom:mushroom-template-card
      entity: sensor.devices_router_zyxel_lan_ipaddress
      primary: '{{ states(entity) if has_value(entity) else ''Unavailable'' }}'
      secondary: Router LAN address
      icon: mdi:ip-network
      color: blue
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: sensor.devices_router_zyxel_cardpage_dhcp4serpoolinfo_clientnumberofentries
      primary: '{{ states(entity) if has_value(entity) else ''Unavailable'' }}'
      secondary: DHCP client entries
      icon: mdi:devices
      color: teal
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: entities
      title: Addressing
      show_header_toggle: false
      entities:
      - entity: sensor.devices_router_zyxel_lan_name
        name: Network
      - entity: sensor.devices_router_zyxel_lan_subnetmask
        name: Subnet mask
      - entity: sensor.devices_router_zyxel_cardpage_dhcp4serpoolinfo_status
        name: DHCP status
      - entity: sensor.devices_router_zyxel_lan_dhcp_minaddress
        name: DHCP range start
      - entity: sensor.devices_router_zyxel_lan_dhcp_maxaddress
        name: DHCP range end
      - entity: sensor.devices_router_zyxel_cardpage_dhcp4serpoolinfo_dnsservers
        name: DNS servers
    - type: entities
      title: Protection
      show_header_toggle: false
      entities:
      - entity: sensor.devices_router_zyxel_device_firewallinfo_enable
        name: Firewall
      - entity: sensor.devices_router_zyxel_device_firewallinfo_ipv4_enable
        name: IPv4 firewall
      - entity: sensor.devices_router_zyxel_device_firewallinfo_ipv6_enable
        name: IPv6 firewall
      - entity: sensor.devices_router_zyxel_device_firewallinfo_x_zyxel_dos_enable
        name: DoS protection
- title: Traffic
  path: traffic
  icon: mdi:chart-bar
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Traffic counters
      heading_style: title
      icon: mdi:chart-bar
    - type: markdown
      content: Received is **cyan**, sent is **teal**. Rates automatically use kbit/s, Mbit/s, or Gbit/s. Totals are interface counters, not monthly usage.
        Charts show bytes transferred each hour. Counter numbers do not identify WAN or LAN; verify the
        entity unique IDs before renaming. Do not add these counters together.
  - type: grid
    cards:
    - type: heading
      heading: Counter 1
      heading_style: title
      icon: mdi:swap-vertical
    - type: custom:mushroom-template-card
      entity: sensor.zyxel_counter_1_received_rate
      primary: |-
        {% set value = states(entity) %}
        {% set unit = state_attr(entity, 'unit_of_measurement') %}
        {% set factors = {'B/s': 8, 'kB/s': 8000, 'MB/s': 8000000,
                          'GB/s': 8000000000, 'TB/s': 8000000000000,
                          'KiB/s': 8192, 'MiB/s': 8388608,
                          'GiB/s': 8589934592, 'TiB/s': 8796093022208} %}
        {% if has_value('sensor.devices_router_zyxel_bytes_received')
            and is_number(value) and unit in factors and value | float >= 0 %}
          {% set bits = value | float * factors[unit] %}
          {% if bits >= 1000000000 %}
            {{ (bits / 1000000000) | round(2) }} Gbit/s
          {% elif bits >= 1000000 %}
            {{ (bits / 1000000) | round(2) }} Mbit/s
          {% else %}
            {{ (bits / 1000) | round(2) }} kbit/s
          {% endif %}
        {% else %}
          Unavailable
        {% endif %}
      secondary: Receive rate
      icon: mdi:download-network
      color: cyan
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: sensor.devices_router_zyxel_bytes_received
      primary: |-
        {% set value = states(entity) %}
        {% set unit = state_attr(entity, 'unit_of_measurement') %}
        {% set factors = {'B': 1, 'kB': 1000, 'MB': 1000000, 'GB': 1000000000,
                          'TB': 1000000000000, 'KiB': 1024, 'MiB': 1048576,
                          'GiB': 1073741824, 'TiB': 1099511627776} %}
        {% if is_number(value) and unit in factors %}
          {{ (value | float * factors[unit] / 1000000000) | round(2) }} GB
        {% elif has_value(entity) %}
          {{ value }} {{ unit or '' }}
        {% else %}
          Unavailable
        {% endif %}
      secondary: Received · counter total
      icon: mdi:download-network
      color: cyan
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: sensor.zyxel_counter_1_sent_rate
      primary: |-
        {% set value = states(entity) %}
        {% set unit = state_attr(entity, 'unit_of_measurement') %}
