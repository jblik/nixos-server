        {% if has_value('sensor.devices_router_zyxel_bytes_sent')
            and is_number(value) and unit in factors and value | float >= 0 %}
          {% set bits = value | float * factors[unit] %}
          {% if bits >= 1000000000 %}
            {{ (bits / 1000000000) | round(2) }} Gbit/s
          {% elif bits >= 1000000 %}
            {{ (bits / 1000000) | round(2) }} Mbit/s
          {% else %}
            {{ (bits / 1000) | round(2) }} kbit/s
          {% endif %}
        {% else %}
          Unavailable
        {% endif %}
      secondary: Send rate
      icon: mdi:upload-network
      color: teal
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: sensor.devices_router_zyxel_bytes_sent
      primary: |-
        {% set value = states(entity) %}
        {% set unit = state_attr(entity, 'unit_of_measurement') %}
